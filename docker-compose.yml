version: '3.8'

services:
  market-alpha-engine:
    build: .
    container_name: neuro-econometric-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models_saved:/app/models_saved
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=UTC
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

