name: Deploy frontend to GitHub Pages

# Static frontend only (frontend/index.html calls the Lambda Function URL
# directly via CORS -- no build step, no secrets, nothing this workflow
# needs beyond the standard Pages deploy permissions). Separate from
# deploy.yml (which ships the backend to Lambda) since these have no
# dependency on each other and no reason to block on one another.

on:
  push:
    branches: [main]
    paths: ["frontend/**"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Upload and deploy run in separate jobs. In one job, deploy-pages can look
# up the artifact a fraction of a second after it is finalized and find
# nothing ("No artifacts named github-pages"); a re-run then fails on two
# artifacts with that name (actions/deploy-pages#451). The job boundary
# gives the lookup time to see the upload, as in GitHub's other starters.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
